<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Nexus</title>
<!--%PWAHEAD%-->
<!--%HEADER%-->
<script>(function(){var t;try{var s=JSON.parse(localStorage.getItem("nexus.v1")||"{}");t=s&&s.settings&&s.settings.theme}catch(e){}if(t!=="light"&&t!=="dark")t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.dataset.theme=t})()</script>
<style>/*%CSS%*/</style>
</head>
<body>
<canvas id="gl" aria-label="3D map of your resources"></canvas>
<div id="labels" aria-hidden="true"></div>
<div id="hud"></div>
<div id="sheets"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="boot"><div class="boot-core"><div class="boot-spin"></div><div class="boot-title">Nexus</div><div class="boot-sub" id="boot-sub">Loading</div></div></div>
<noscript><p style="padding:24px;color:#000;background:#F2F2F7;font:17px -apple-system,sans-serif">Nexus needs JavaScript. Open this file in a normal browser.</p></noscript>
<script>/*%JS%*/</script>
<!--%PWATAIL%-->
</body>
</html>
