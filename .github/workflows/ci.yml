# ci.yml - the compiler and test runner for the Flutter app. Nobody can run Flutter on the phone, so THIS is the proof.
# Jobs: check (Node only, fast) -> test (flutter analyze + flutter test) -> web build -> android apk build -> deploy to GitHub Pages.
# Orientation: an error is a FAILURE (the job step says so and exits 1); no error is a SUCCESS (exit 0).
# Every job writes the errors it can see into the run's Summary tab, so no job can turn the run red without a matching line.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (lint + golden files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dart lint (tools/lint_dart.mjs)
        run: node tools/lint_dart.mjs
      - name: Golden files must match the web code
        run: |
          TZ=UTC node tools/gen_golden.mjs
          git diff --exit-code -- fixtures || { echo "::error::ERROR fixtures/ changed after regenerating them from legacy/web-src. Do not edit fixtures/ or legacy/ by hand."; exit 1; }

  test:
    name: test (analyze + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Versions
        run: |
          flutter --version
          dart --version
      - name: Create android and web folders if they are not committed yet
        run: |
          if [ ! -d android ] || [ ! -d web ]; then
            flutter create --platforms=android,web --project-name nexus --org app.nexus .
            rm -f test/widget_test.dart
          fi
      - name: flutter pub get
        run: flutter pub get
      - name: flutter analyze
        shell: bash
        run: flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
      - name: flutter test
        shell: bash
        run: flutter test 2>&1 | tee test.log
        env:
          TZ: UTC
      # Manual route: no gh needed. Open the run > Summary tab, copy the block into docs/CI_LAST.txt, tell the agent.
      - name: Verdict (fails only when an error is found, passes when none is)
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          missing=0
          for f in analyze.log test.log; do
            if [ ! -s "$f" ]; then missing=1; echo "LOGS MISSING OR EMPTY: $f - the step that writes it did not run"; fi
          done
          {
            echo '### Problems, copy this block into docs/CI_LAST.txt'
            echo '```'
            echo "commit: ${GITHUB_SHA::7}  flutter: $(flutter --version | head -n 1)"
            for f in analyze.log test.log; do
              if [ ! -s "$f" ]; then echo "LOGS MISSING OR EMPTY: $f - could not check it, so this is NOT a pass"; fi
            done
            grep -hE "error •|warning •|\[E\]|Expected|Actual|expected:|actual:|Some tests failed|Exception|Error:|Could not|version solving|Because " analyze.log test.log 2>/dev/null | head -n 120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -qE "error •|\[E\]|Some tests failed" analyze.log test.log 2>/dev/null; then
            echo "::error::ERROR FOUND in analyze.log or test.log - read the Summary tab"
            exit 1
          fi
          if [ "$missing" = 1 ]; then
            echo "::error::a log is missing, so this is NOT a pass - read the Summary tab"
            exit 1
          fi
          echo "SUCCESS: no errors found in analyze.log or test.log"
          exit 0

  web:
    name: web build
    needs: [check, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create the web folder if it is not committed yet
        run: |
          if [ ! -d web ]; then flutter create --platforms=web --project-name nexus --org app.nexus . ; fi
          rm -f test/widget_test.dart
      - name: flutter pub get
        run: flutter pub get
      - name: flutter build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" 2>&1 | tee web-build.log
      - name: Verdict (fails only when the build failed, passes when it built)
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          missing=0
          if [ ! -s web-build.log ]; then missing=1; fi
          {
            echo '### Web build'
            echo '```'
            if [ ! -s web-build.log ]; then echo "LOGS MISSING OR EMPTY: web-build.log - could not check it, so this is NOT a pass"; fi
            grep -hE "error|Error|FAILED|Exception|failed" web-build.log 2>/dev/null | head -n 40
            if [ -f build/web/index.html ]; then echo "OK: build/web/index.html ($(find build/web -type f | wc -l) files)"; else echo "FAILED: no build/web/index.html"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/web/index.html ] && [ "$missing" = 0 ]; then
            echo "SUCCESS: the web build produced build/web/index.html"
            exit 0
          fi
          echo "::error::FAILED: no build/web/index.html - read the Summary tab"
          exit 1

  apk:
    name: android apk
    needs: [check, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create the android folder if it is not committed yet
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --project-name nexus --org app.nexus . ; fi
          rm -f test/widget_test.dart
      - name: flutter pub get
        run: flutter pub get
      # Release build signed with the debug key: fine for installing on your own phone.
      # A Play Store build needs a keystore, which never belongs in this repo.
      - name: flutter build apk
        run: flutter build apk --release 2>&1 | tee apk-build.log
      - name: Verdict (fails only when the build failed, passes when it built)
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          missing=0
          if [ ! -s apk-build.log ]; then missing=1; fi
          {
            echo '### Android apk'
            echo '```'
            if [ ! -s apk-build.log ]; then echo "LOGS MISSING OR EMPTY: apk-build.log - could not check it, so this is NOT a pass"; fi
            grep -hE "error|Error|FAILED|Exception|failed" apk-build.log 2>/dev/null | head -n 40
            if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
              echo "OK: app-release.apk ($(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1))"
            else
              echo "FAILED: no app-release.apk"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/app/outputs/flutter-apk/app-release.apk ] && [ "$missing" = 0 ]; then
            echo "SUCCESS: the apk build produced app-release.apk"
            exit 0
          fi
          echo "::error::FAILED: no app-release.apk - read the Summary tab"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  deploy:
    name: deploy to GitHub Pages (optional)
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Until the owner turns Pages on (Settings > Pages > Source: GitHub Actions) this job fails. That must not make the whole run red.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
